[package]
name = "radar"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Reports for agents: a line of code plus a note, kept in PoloDB, published as markdown"
repository = "https://github.com/jbisfun/radar"

[features]
default = ["mcp"]
# `radar mcp`: MCP server (stdio) over the store, for agents.
mcp = ["dep:rmcp", "dep:schemars", "dep:tokio"]

[dependencies]
polodb_core = "5.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
rmcp = { version = "3.10.0", features = ["server", "transport-io", "macros"], optional = true }
schemars = { version = "1.2.3", optional = true }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "io-std"], optional = true }
